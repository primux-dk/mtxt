name: Recorder

# The desktop recorder on the two platforms it ships for. Nothing here runs a
# microphone or a meeting: CI has no audio devices. It proves the recorder
# builds, its Rust unit tests pass on each platform, and it hands over the
# Windows installers. The manual checks on a real machine are in
# apps/recorder/README.md ("Checking a Windows build").

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: recorder-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (Rust tests, MSI and NSIS installers)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # bindgen (whisper-rs-sys) finds libclang in the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/recorder/src-tauri -> target
      - name: Rust unit tests, the contract test and the mock server
        working-directory: apps/recorder/src-tauri
        run: cargo test --locked
      - name: Build the installers
        run: pnpm --filter @mtxt/recorder tauri build --ci
      - name: List the bundle
        run: ls -la apps/recorder/src-tauri/target/release/bundle/msi apps/recorder/src-tauri/target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: mtxt-recorder-windows
          path: |
            apps/recorder/src-tauri/target/release/bundle/msi/*.msi
            apps/recorder/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS (Rust tests, universal app)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/recorder/src-tauri -> target
      - name: Rust unit tests, the contract test and the mock server
        working-directory: apps/recorder/src-tauri
        run: cargo test --locked
      - name: Build the universal app, as pnpm recorder:build does
        run: pnpm recorder:build --ci --bundles app
