name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Generate, typecheck, lint, test, build, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files are current (contract types, migrations, Worker env types)
        run: pnpm check:generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build the Worker with OpenNext
        run: pnpm build
      - name: Licence check
        run: pnpm check:licenses

  e2e:
    name: Playwright on wrangler dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the pinned Playwright
        run: pnpm --filter @mtxt/web exec playwright install --with-deps chromium
      - name: Build the e2e Worker (adds the test-only sign-in)
        run: pnpm --filter @mtxt/web build:e2e
      - name: Playwright against wrangler dev
        run: pnpm test:e2e
        env:
          E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-and-report
          path: |
            apps/web/e2e/__screenshots__/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
