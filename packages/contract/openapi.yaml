openapi: 3.1.0
info:
  title: mtxt recorder-to-server contract
  version: 0.1.0
  description: |
    How a recording reaches the library (docs/spec.md). The recorder announces a
    recording, uploads it in 8 MB chunks that can be resent, asks the server to
    verify the whole file, and polls until the transcript exists.

    "Confirmed" means the server holds the whole file and its SHA-256 matches.
    Only then does the recorder start its 7-day local timer.

    The recorder and the server share only this file and the types generated
    from it.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
servers:
  - url: /api/v1
    description: Relative to the install's own hostname.
security:
  - companyLogin: []
paths:
  /recordings:
    post:
      operationId: createRecording
      summary: Announce a recording and get an upload session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRecordingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No meeting with this `meeting_id` that the caller may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is larger than the install accepts (2 GB in v0.1, `too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}/chunks/{n}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
      - name: n
        in: path
        required: true
        description: Chunk number, 1-based. Chunk n holds bytes (n-1) × chunk_size_bytes onwards.
        schema:
          type: integer
          minimum: 1
    put:
      operationId: uploadChunk
      summary: Upload one chunk. Sending the same chunk again replaces it.
      description: |
        Every chunk but the last is exactly `chunk_size_bytes`. Chunks may arrive
        in any order and more than once. When the size is not known yet (a
        recording still in progress), a chunk smaller than `chunk_size_bytes` is
        taken as the last one; complete checks it.
      parameters:
        - name: Content-Length
          in: header
          required: false
          description: Optional; a chunk sent with chunked transfer encoding has none. Over 8 MiB is refused before reading.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Chunk stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `not_uploading`: the recording no longer accepts chunks (it is
            confirmed, failed or being verified); the body was not read.
            `busy`: another chunk of this recording is being written; retry
            this one after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent with `busy`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '413':
          description: The chunk is larger than `chunk_size_bytes`, or lies past the largest file the install accepts (`too_large`). The server stops reading at one byte past the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The request body is not `application/octet-stream` (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    post:
      operationId: completeRecording
      summary: Ask the server to verify the whole file against the announced SHA-256.
      description: |
        Idempotent. Calling it again on a confirmed recording returns the
        recording with its `confirmed_at`; the status may have moved on to
        `transcribing`. The recorder treats `confirmed_at` as the confirmation.
      requestBody:
        required: false
        description: |
          Required when `sha256` and `size_bytes` were left out of the create
          request, because the audio was still being recorded. When both
          requests carry them, they must match.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRecordingRequest'
      responses:
        '200':
          description: The server holds the whole file and the hash matches. The recording is confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `missing_chunks`: chunks are missing; the body lists them. Upload
            them and call complete again. `not_uploading`: the session is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '413':
          description: '`size_bytes` is larger than the install accepts (`too_large`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            All chunks arrived but the file does not match (`hash_mismatch` or
            `size_mismatch`), or the session expired after 7 days
            (`session_expired`). The recording is `failed` and the server has
            deleted what it held. The recorder keeps its file and starts again
            with a new create request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      summary: Poll the state of a recording.
      responses:
        '200':
          description: The recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    companyLogin:
      type: http
      scheme: bearer
      description: An access token from the install's company login (OIDC). Defined in v0.2.
  parameters:
    RecordingId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid company login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something went wrong on the server (`internal`). Safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller may see the meeting but does not own it. Only the owner uploads (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No recording with this id that the caller may see.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RecordingStatus:
      type: string
      description: |
        Server-side state of a recording. The recorder's own states (Recording,
        Uploading, Pending, Warn, AskUser, Confirmed, Deleted) are local and not
        part of this contract.
      enum: [uploading, confirmed, transcribing, transcribed, failed]
    RecordingSource:
      type: string
      enum: [desktop, browser, upload, teams, meet, device]
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the whole file.
      pattern: '^[0-9a-f]{64}$'
    NewMeeting:
      type: object
      required: [title, started_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        started_at:
          type: string
          format: date-time
    RecordingDetails:
      type: object
      description: |
        `sha256` and `size_bytes` come together or not at all. A recorder that
        has the whole file sends them here. One that uploads while it records
        (the browser recorder) leaves both out and sends them with complete.
      required: [duration_s, source, content_type]
      dependentRequired:
        sha256: [size_bytes]
        size_bytes: [sha256]
      properties:
        duration_s:
          type: integer
          minimum: 0
          description: Seconds. 0 when not known yet; complete can set it.
        sha256:
          $ref: '#/components/schemas/Sha256'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
        source:
          $ref: '#/components/schemas/RecordingSource'
        content_type:
          type: string
          maxLength: 200
          pattern: '^([Aa][Uu][Dd][Ii][Oo]|[Vv][Ii][Dd][Ee][Oo])/[A-Za-z0-9][A-Za-z0-9.+-]*(\s*;\s*[A-Za-z0-9-]+=("[^"]*"|[^;"\s]+))*$'
          description: Audio or video MIME type, for example audio/ogg or audio/mp4. Anything else is refused.
    CreateRecordingRequest:
      description: Exactly one of `meeting_id` (a meeting that exists) or `meeting` (create one).
      oneOf:
        - title: ForExistingMeeting
          allOf:
            - $ref: '#/components/schemas/RecordingDetails'
            - type: object
              required: [meeting_id]
              properties:
                meeting_id:
                  type: string
                meeting:
                  not: {}
        - title: ForNewMeeting
          allOf:
            - $ref: '#/components/schemas/RecordingDetails'
            - type: object
              required: [meeting]
              properties:
                meeting:
                  $ref: '#/components/schemas/NewMeeting'
                meeting_id:
                  not: {}
    CreateRecordingResponse:
      type: object
      additionalProperties: false
      required: [id, meeting_id, upload_url, chunk_size_bytes, chunk_count, status]
      properties:
        id:
          type: string
        meeting_id:
          type: string
        upload_url:
          type: string
          description: Base URL for chunks; the recorder appends `/{n}`.
        chunk_size_bytes:
          type: integer
          description: Size of every chunk but the last. 8 MB (8388608) in v0.1.
        chunk_count:
          type: [integer, 'null']
          minimum: 1
          description: Null while the size is not known.
        status:
          $ref: '#/components/schemas/RecordingStatus'
    ChunkReceipt:
      type: object
      additionalProperties: false
      required: [n, size_bytes, chunks_received, chunk_count]
      properties:
        n:
          type: integer
        size_bytes:
          type: integer
        chunks_received:
          $ref: '#/components/schemas/ChunkNumbers'
        chunk_count:
          type: [integer, 'null']
          description: Null while the size is not known.
    ChunkNumbers:
      type: array
      description: Chunk numbers the server holds, ascending.
      items:
        type: integer
        minimum: 1
    CompleteRecordingRequest:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256:
          $ref: '#/components/schemas/Sha256'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
        duration_s:
          type: integer
          minimum: 0
    Conflict:
      type: object
      description: |
        Every 409. `reason` says which: `busy` (retry after `retry_after`
        seconds), `not_uploading` (the recording no longer takes chunks or
        the session is gone), `missing_chunks` (`missing` lists them).
      additionalProperties: false
      required: [error, reason]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        reason:
          type: string
          enum: [busy, not_uploading, missing_chunks]
        missing:
          type: array
          items:
            type: integer
            minimum: 1
        retry_after:
          type: integer
          minimum: 0
    Recording:
      type: object
      additionalProperties: false
      required:
        [
          id,
          meeting_id,
          status,
          sha256,
          size_bytes,
          duration_s,
          source,
          created_at,
          chunk_count,
          chunks_received,
        ]
      properties:
        id:
          type: string
        meeting_id:
          type: string
        status:
          $ref: '#/components/schemas/RecordingStatus'
        sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
          description: Null until known, when the create request left it out.
        size_bytes:
          type: [integer, 'null']
          description: Null until known, when the create request left it out.
        chunk_count:
          type: [integer, 'null']
          description: Null while the size is not known.
        chunks_received:
          $ref: '#/components/schemas/ChunkNumbers'
          description: While `uploading`, the chunks the server holds, so a recorder can resume. Empty in every other status.
        duration_s:
          type: integer
        source:
          $ref: '#/components/schemas/RecordingSource'
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: Set when the hash matched. The recorder's 7-day timer starts here.
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
          description: Set when status is failed.
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. v0.1 uses `unauthorized`,
            `forbidden`, `not_found`, `invalid_request`, `too_large`,
            `source_disabled`, `chunk_size`, `not_uploading`, `missing_chunks`,
            `hash_mismatch`, `size_mismatch`, `session_expired`, `busy`,
            `unsupported_media_type` and `internal`.
        message:
          type: string
          description: English text for logs. The recorder shows its own localised message per code.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
