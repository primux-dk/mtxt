openapi: 3.1.0
info:
  title: mtxt recorder-to-server contract
  version: 0.1.0
  description: |
    How a recording reaches the library (docs/spec.md). The recorder announces a
    recording, uploads it in 8 MB chunks that can be resent, asks the server to
    verify the whole file, and polls until the transcript exists.

    "Confirmed" means the server holds the whole file and its SHA-256 matches.
    Only then does the recorder start its 7-day local timer.

    ## Recorder connection

    A desktop recorder connects once, through the browser, and then sends a
    bearer token with every call. It never handles the company's identity
    provider. The values below are also in `x-recorder-flow`.

    1. **Verifier and challenge (RFC 7636 S256).** The verifier is 32 random
       bytes from the OS random source, base64url without padding: 43
       characters of `A-Z a-z 0-9 - _` (the server accepts 43 to 128
       characters of `A-Z a-z 0-9 - . _ ~`). The challenge is the SHA-256 of
       the verifier's ASCII bytes, base64url without padding: 43 characters.
       Keep the verifier in memory only; never put it in a URL or a log.
    2. **Device name.** Take the computer's name, then: remove every code
       point in the Unicode general categories Cc, Cf, Zl and Zp (this
       removes control characters, the bidi controls U+200E, U+200F,
       U+202A to U+202E and U+2066 to U+2069, and zero-width characters);
       normalise to NFC; trim Unicode White_Space at both ends; truncate to
       64 Unicode code points; trim again. If nothing is left, use
       "Recorder". The server takes 1 to 64 code points after NFC and trim
       and refuses a name with any of those categories.
    3. **Pairing code.** SHA-256 of the challenge's ASCII bytes; read the
       first 4 bytes as a big-endian unsigned 32-bit integer and shift it
       right by 2 (the first 30 bits); split those into six 5-bit groups,
       most significant first; map each through Crockford's base32 alphabet
       `0123456789ABCDEFGHJKMNPQRSTVWXYZ`; show it as `XXX-XXX` next to
       "Waiting for approval". The connect page shows the same code and
       tells the user to approve only when they match. Worked example: the
       challenge `E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM` gives the
       bytes `0d 29 9b 1e`, the 30-bit value 55207623, and the code
       `1MM-SP7`.
    4. **Open the browser** at `https://<host>/connect?challenge=<challenge>&name=<device name>`,
       where `<host>` is the install's own hostname. Percent-encode the
       name's UTF-8 bytes as RFC 3986 says for a query value (everything
       outside `A-Z a-z 0-9 - . _ ~`; a space is `%20`, so
       "Kontor Ærø" is `Kontor%20%C3%86r%C3%B8`). The server also reads `+`
       as a space. The challenge needs no encoding.
    5. **Poll** `POST /api/v1/recorder/token` with
       `{"challenge": "...", "verifier": "..."}` and
       `Content-Type: application/json`, no Authorization header, body at
       most 4096 bytes. Wait the seconds in `Retry-After` (an integer, in
       seconds) between polls; the 202 says 2. Stop after 10 minutes and
       ask the user to connect again. The answers, all JSON:
       - `200` the token: see `RecorderToken`. It comes once.
       - `202` `{"status": "pending"}` with `Retry-After: 2`: not approved yet.
       - `400` `{"error": {"code": "invalid_request", "message": "..."}}`:
         the body is not JSON or a field has the wrong format. A bug; stop.
       - `410` `{"error": {"code": "expired" | "denied", "message": "..."}}`:
         `expired` is past the grant's 10 minutes or already used; `denied`
         is Cancel on the page, or a verifier that does not hash to the
         challenge. Stop and connect again.
       - `413` `{"error": {"code": "too_large", ...}}`: the body is over 4096 bytes.
       - `429` `{"error": {"code": "rate_limited", ...}, "retry_after": n}`
         with `Retry-After: n`: more than one poll a second on an approved
         grant. Wait n seconds.
       - `500` `{"error": {"code": "internal", ...}}`: retry after 2 seconds.
    6. **Use the token.** It is `mtxt_` followed by 43 base64url characters
       (48 in all), valid until `expires_at` (180 days). Store it in the OS
       keychain. Send it on every other call as
       `Authorization: Bearer <token>`. A 401 with code `unauthorized` means
       the token is unknown, expired or revoked: delete it and connect again.
    7. **Disconnect** with `DELETE /api/v1/recorder/tokens/{token_id}` and
       the token itself: 204, then delete it from the keychain. Another
       token's id is 404; a recorder revokes only its own token.

    The recorder and the server share only this file and the types generated
    from it.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
x-recorder-flow:
  connect_url: https://{host}/connect?challenge={challenge}&name={device_name}
  name_encoding: RFC 3986 percent-encoding of the UTF-8 bytes; '+' is also read as a space
  device_name:
    normalisation: NFC, then trim Unicode White_Space
    min_code_points: 1
    max_code_points: 64
    prohibited_categories: [Cc, Cf, Zl, Zp]
    recorder_shortening: remove prohibited code points, NFC, trim, truncate to 64 code points, trim; empty becomes "Recorder"
  verifier:
    make: 32 random bytes, base64url without padding (43 characters)
    accepted_pattern: '^[A-Za-z0-9._~-]{43,128}$'
  challenge:
    make: base64url without padding of SHA-256(ASCII bytes of verifier)
    pattern: '^[A-Za-z0-9_-]{43}$'
  pairing_code:
    make: first 30 bits of SHA-256(ASCII bytes of challenge), six 5-bit groups most significant first, Crockford base32
    alphabet: 0123456789ABCDEFGHJKMNPQRSTVWXYZ
    format: XXX-XXX
    example:
      challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      first_bytes_hex: 0d299b1e
      bits: 55207623
      code: 1MM-SP7
  poll:
    path: /api/v1/recorder/token
    interval_seconds: 2
    give_up_after_seconds: 600
    max_body_bytes: 4096
    retry_after: integer seconds
  token:
    pattern: '^mtxt_[A-Za-z0-9_-]{43}$'
    header: 'Authorization: Bearer <token>'
    lifetime_days: 180
servers:
  - url: /api/v1
    description: Relative to the install's own hostname.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /recorder/token:
    post:
      operationId: pollRecorderToken
      summary: Exchange an approved connection for a bearer token. Poll until 200 or 410.
      description: |
        The recorder opened `/connect?challenge=<challenge>&name=<device name>`
        in the default browser and now polls here every 2 seconds (the 202's
        `Retry-After`) with the challenge and the verifier it was made from.

        - 202: no grant for this challenge yet; the user has not approved.
          Keep polling. The recorder gives up after 10 minutes on its own and
          says "Open the recorder and connect again" in its own words.
        - 200: the token, once. Store it in the OS keychain. The server keeps
          only its hash, so a lost response cannot be repeated: the next poll
          is 410 and the recorder connects again.
        - 410: `expired` (the grant passed its 10 minutes or was already
          used) or `denied` (the user chose Cancel, or the verifier does not
          hash to the challenge). Stop polling; connect again.
        - 429: more than one poll a second on an approved grant; wait
          `Retry-After` seconds.

        The body is checked before anything else, so 400 and a wrong
        verifier cost the server nothing; a challenge with no grant costs
        one read.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecorderTokenRequest'
      responses:
        '200':
          description: Approved. The token, with what the recorder needs to brand itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderToken'
        '202':
          description: Not approved yet. Poll again after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before the next poll (2).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderTokenPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: The grant expired, was used, was denied, or the verifier does not match (`expired`, `denied`). Stop polling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body is over 4 KiB (`too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: More than one poll a second on an approved grant (`rate_limited`).
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /recorder/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The `token_id` from the token response.
        schema:
          type: string
    delete:
      operationId: revokeRecorderToken
      summary: Disconnect a recorder. The token stops working at once.
      description: |
        The recorder disconnects itself with its own `token_id` (a "Sign out"
        in the recorder). With a bearer token, `{id}` must be the id of that
        same token; any other id is 404, so a recorder never revokes another
        of the user's recorders. With the library's session cookie, any of
        the user's own recorder tokens may be revoked, and one already
        revoked is 204 again. After revoking its own token the recorder
        deletes it from the keychain; every later call with it is 401.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: With a bearer token, `{id}` is not the calling token; with the session, no recorder token with this id belongs to the caller (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /recordings:
    post:
      operationId: createRecording
      summary: Announce a recording and get an upload session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordingRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRecordingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No meeting with this `meeting_id` that the caller may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is larger than the install accepts (2 GB in v0.1, `too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}/chunks/{n}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
      - name: n
        in: path
        required: true
        description: Chunk number, 1-based. Chunk n holds bytes (n-1) × chunk_size_bytes onwards.
        schema:
          type: integer
          minimum: 1
    put:
      operationId: uploadChunk
      summary: Upload one chunk. Sending the same chunk again replaces it.
      description: |
        Every chunk but the last is exactly `chunk_size_bytes`. Chunks may arrive
        in any order and more than once. When the size is not known yet (a
        recording still in progress), a chunk smaller than `chunk_size_bytes` is
        taken as the last one; complete checks it.
      parameters:
        - name: Content-Length
          in: header
          required: false
          description: Optional; a chunk sent with chunked transfer encoding has none. Over 8 MiB is refused before reading.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Chunk stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `not_uploading`: the recording no longer accepts chunks (it is
            confirmed, failed or being verified); the body was not read.
            `busy`: another chunk of this recording is being written; retry
            this one after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent with `busy`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '413':
          description: The chunk is larger than `chunk_size_bytes`, or lies past the largest file the install accepts (`too_large`). The server stops reading at one byte past the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The request body is not `application/octet-stream` (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    post:
      operationId: completeRecording
      summary: Ask the server to verify the whole file against the announced SHA-256.
      description: |
        Idempotent. Calling it again on a confirmed recording returns the
        recording with its `confirmed_at`; the status may have moved on to
        `transcribing`. The recorder treats `confirmed_at` as the confirmation.
      requestBody:
        required: false
        description: |
          Required when `sha256` and `size_bytes` were left out of the create
          request, because the audio was still being recorded. When both
          requests carry them, they must match.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRecordingRequest'
      responses:
        '200':
          description: The server holds the whole file and the hash matches. The recording is confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `missing_chunks`: chunks are missing; the body lists them. Upload
            them and call complete again. `not_uploading`: the session is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '413':
          description: '`size_bytes` is larger than the install accepts (`too_large`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            All chunks arrived but the file does not match (`hash_mismatch` or
            `size_mismatch`), or the session expired after 7 days
            (`session_expired`). The recording is `failed` and the server has
            deleted what it held. The recorder keeps its file and starts again
            with a new create request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      summary: Poll the state of a recording.
      responses:
        '200':
          description: The recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A desktop recorder's token from `POST /recorder/token`: `mtxt_` and 43
        base64url characters, valid 180 days, bound to one user and one
        device. A missing, unknown, expired or revoked token is 401 with code
        `unauthorized`; the recorder then connects again.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-authjs.session-token
      description: The library's own session, for the browser recorder and upload in the library. Not for the desktop recorder.
  parameters:
    RecordingId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid company login, or a bearer token that is unknown, expired or revoked (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Something went wrong on the server (`internal`). Safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller may see the meeting but does not own it. Only the owner uploads (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No recording with this id that the caller may see.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RecordingStatus:
      type: string
      description: |
        Server-side state of a recording. The recorder's own states (Recording,
        Uploading, Pending, Warn, AskUser, Confirmed, Deleted) are local and not
        part of this contract.
      enum: [uploading, confirmed, transcribing, transcribed, failed]
    RecordingSource:
      type: string
      enum: [desktop, browser, upload, teams, meet, device]
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the whole file.
      pattern: '^[0-9a-f]{64}$'
    NewMeeting:
      type: object
      required: [title, started_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        started_at:
          type: string
          format: date-time
    RecordingDetails:
      type: object
      description: |
        `sha256` and `size_bytes` come together or not at all. A recorder that
        has the whole file sends them here. One that uploads while it records
        (the browser recorder) leaves both out and sends them with complete.
      required: [duration_s, source, content_type]
      dependentRequired:
        sha256: [size_bytes]
        size_bytes: [sha256]
      properties:
        duration_s:
          type: integer
          minimum: 0
          description: Seconds. 0 when not known yet; complete can set it.
        sha256:
          $ref: '#/components/schemas/Sha256'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
        source:
          $ref: '#/components/schemas/RecordingSource'
        content_type:
          type: string
          maxLength: 200
          pattern: '^([Aa][Uu][Dd][Ii][Oo]|[Vv][Ii][Dd][Ee][Oo])/[A-Za-z0-9][A-Za-z0-9.+-]*(\s*;\s*[A-Za-z0-9-]+=("[^"]*"|[^;"\s]+))*$'
          description: Audio or video MIME type, for example audio/ogg or audio/mp4. Anything else is refused.
    CreateRecordingRequest:
      description: Exactly one of `meeting_id` (a meeting that exists) or `meeting` (create one).
      oneOf:
        - title: ForExistingMeeting
          allOf:
            - $ref: '#/components/schemas/RecordingDetails'
            - type: object
              required: [meeting_id]
              properties:
                meeting_id:
                  type: string
                meeting:
                  not: {}
        - title: ForNewMeeting
          allOf:
            - $ref: '#/components/schemas/RecordingDetails'
            - type: object
              required: [meeting]
              properties:
                meeting:
                  $ref: '#/components/schemas/NewMeeting'
                meeting_id:
                  not: {}
    CreateRecordingResponse:
      type: object
      additionalProperties: false
      required: [id, meeting_id, upload_url, chunk_size_bytes, chunk_count, status]
      properties:
        id:
          type: string
        meeting_id:
          type: string
        upload_url:
          type: string
          description: Base URL for chunks; the recorder appends `/{n}`.
        chunk_size_bytes:
          type: integer
          description: Size of every chunk but the last. 8 MB (8388608) in v0.1.
        chunk_count:
          type: [integer, 'null']
          minimum: 1
          description: Null while the size is not known.
        status:
          $ref: '#/components/schemas/RecordingStatus'
    ChunkReceipt:
      type: object
      additionalProperties: false
      required: [n, size_bytes, chunks_received, chunk_count]
      properties:
        n:
          type: integer
        size_bytes:
          type: integer
        chunks_received:
          $ref: '#/components/schemas/ChunkNumbers'
        chunk_count:
          type: [integer, 'null']
          description: Null while the size is not known.
    ChunkNumbers:
      type: array
      description: Chunk numbers the server holds, ascending.
      items:
        type: integer
        minimum: 1
    CompleteRecordingRequest:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256:
          $ref: '#/components/schemas/Sha256'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
        duration_s:
          type: integer
          minimum: 0
    Conflict:
      type: object
      description: |
        Every 409. `reason` says which: `busy` (retry after `retry_after`
        seconds), `not_uploading` (the recording no longer takes chunks or
        the session is gone), `missing_chunks` (`missing` lists them).
      additionalProperties: false
      required: [error, reason]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        reason:
          type: string
          enum: [busy, not_uploading, missing_chunks]
        missing:
          type: array
          items:
            type: integer
            minimum: 1
        retry_after:
          type: integer
          minimum: 0
    Recording:
      type: object
      additionalProperties: false
      required:
        [
          id,
          meeting_id,
          status,
          sha256,
          size_bytes,
          duration_s,
          source,
          created_at,
          chunk_count,
          chunks_received,
        ]
      properties:
        id:
          type: string
        meeting_id:
          type: string
        status:
          $ref: '#/components/schemas/RecordingStatus'
        sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
          description: Null until known, when the create request left it out.
        size_bytes:
          type: [integer, 'null']
          description: Null until known, when the create request left it out.
        chunk_count:
          type: [integer, 'null']
          description: Null while the size is not known.
        chunks_received:
          $ref: '#/components/schemas/ChunkNumbers'
          description: While `uploading`, the chunks the server holds, so a recorder can resume. Empty in every other status.
        duration_s:
          type: integer
        source:
          $ref: '#/components/schemas/RecordingSource'
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: Set when the hash matched. The recorder's 7-day timer starts here.
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
          description: Set when status is failed.
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. v0.1 uses `unauthorized`,
            `forbidden`, `not_found`, `invalid_request`, `too_large`,
            `source_disabled`, `chunk_size`, `not_uploading`, `missing_chunks`,
            `hash_mismatch`, `size_mismatch`, `session_expired`, `busy`,
            `unsupported_media_type`, `rate_limited`, `expired`, `denied` and
            `internal`.
        message:
          type: string
          description: English text for logs. The recorder shows its own localised message per code.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    RecorderTokenRequest:
      type: object
      required: [challenge, verifier]
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The challenge in the `/connect` URL, base64url SHA-256 of the verifier without padding (RFC 7636 S256).
        verifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: The code verifier, kept by the recorder and never shown to the browser. 32 random bytes in base64url (43 characters).
    RecorderToken:
      type: object
      additionalProperties: false
      required: [token, token_id, expires_at, device_name, user, install]
      properties:
        token:
          type: string
          pattern: '^mtxt_[A-Za-z0-9_-]{43}$'
          description: 'Send as `Authorization: Bearer <token>`. Shown once.'
        token_id:
          type: string
          description: For `DELETE /recorder/tokens/{id}`.
        expires_at:
          type: string
          format: date-time
          description: 180 days after the token was issued.
        device_name:
          type: string
          description: The device name the user approved, as the library lists it.
        user:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              description: The user's display name, for the recorder's footer.
        install:
          type: object
          additionalProperties: false
          required: [product_name, theme_accent, theme_primary]
          description: The install's branding. The recorder reads it here at connect.
          properties:
            product_name:
              type: string
            theme_accent:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Accent colour.
            theme_primary:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              description: Button colour.
    RecorderTokenPending:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    RateLimited:
      type: object
      additionalProperties: false
      required: [error, retry_after]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        retry_after:
          type: integer
          minimum: 1
